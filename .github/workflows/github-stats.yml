name: Update GitHub Analytics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate analytics SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: prathamc00
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from collections import Counter
          from datetime import datetime, timezone
          token=os.environ['GH_TOKEN']; user=os.environ['USERNAME']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r: return json.load(r)
          profile=get(f'https://api.github.com/users/{user}')
          repos=get(f'https://api.github.com/users/{user}/repos?per_page=100&sort=updated')
          languages=Counter()
          for repo in repos:
              if repo.get('fork'): continue
              try: languages.update(get(repo['languages_url']))
              except Exception: pass
          total=sum(languages.values()) or 1
          top=languages.most_common(6)
          orange='#F97316'; light='#FFF7ED'; muted='#FDBA74'; bg='#1A0F05'
          os.makedirs('profile',exist_ok=True)
          date=datetime.now(timezone.utc).strftime('%Y-%m-%d')
          stats=f'''<svg xmlns="http://www.w3.org/2000/svg" width="495" height="220"><rect width="495" height="220" rx="8" fill="{bg}"/><text x="24" y="38" fill="{orange}" font-family="Arial" font-size="22" font-weight="700">GitHub Stats</text><text x="24" y="78" fill="{light}" font-family="Arial" font-size="15">Public repositories</text><text x="470" y="78" text-anchor="end" fill="{orange}" font-family="Arial" font-size="18">{profile.get('public_repos',0)}</text><text x="24" y="112" fill="{light}" font-family="Arial" font-size="15">Followers</text><text x="470" y="112" text-anchor="end" fill="{orange}" font-family="Arial" font-size="18">{profile.get('followers',0)}</text><text x="24" y="146" fill="{light}" font-family="Arial" font-size="15">Total stars</text><text x="470" y="146" text-anchor="end" fill="{orange}" font-family="Arial" font-size="18">{sum(r.get('stargazers_count',0) for r in repos)}</text><text x="24" y="180" fill="{muted}" font-family="Arial" font-size="13">Updated {date}</text></svg>'''
          open('profile/github-stats.svg','w').write(stats)
          bars=[]; y=62
          for name,count in top:
              pct=count/total*100; width=446*pct/100
              bars.append(f'<text x="24" y="{y}" fill="{light}" font-family="Arial" font-size="14">{name}</text><text x="470" y="{y}" text-anchor="end" fill="{muted}" font-family="Arial" font-size="14">{pct:.1f}%</text><rect x="24" y="{y+8}" width="446" height="7" rx="3" fill="#3A2415"/><rect x="24" y="{y+8}" width="{width:.1f}" height="7" rx="3" fill="{orange}"/>'); y+=45
          open('profile/top-langs.svg','w').write(f'''<svg xmlns="http://www.w3.org/2000/svg" width="495" height="330"><rect width="495" height="330" rx="8" fill="{bg}"/><text x="24" y="38" fill="{orange}" font-family="Arial" font-size="22" font-weight="700">Most Used Languages</text>{''.join(bars)}</svg>''')
          query='query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{contributionLevel}}}}}}'
          payload=json.dumps({'query':query,'variables':{'login':user}}).encode()
          req=urllib.request.Request('https://api.github.com/graphql',data=payload,headers={**headers,'Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r: cal=json.load(r)['data']['user']['contributionsCollection']['contributionCalendar']
          levels={'NONE':'#3A2415','FIRST_QUARTILE':'#7C2D12','SECOND_QUARTILE':'#C2410C','THIRD_QUARTILE':'#EA580C','FOURTH_QUARTILE':'#FB923C'}
          cells=[]
          for wi,w in enumerate(cal['weeks']):
              for di,d in enumerate(w['contributionDays']): cells.append(f'<rect x="{24+wi*11}" y="{58+di*11}" width="8" height="8" rx="2" fill="{levels.get(d["contributionLevel"],levels["NONE"])}"/>')
          open('profile/contribution-activity.svg','w').write(f'''<svg xmlns="http://www.w3.org/2000/svg" width="820" height="150"><rect width="820" height="150" rx="8" fill="{bg}"/><text x="24" y="30" fill="{orange}" font-family="Arial" font-size="18" font-weight="700">Contribution Activity</text>{''.join(cells)}<text x="24" y="140" fill="{muted}" font-family="Arial" font-size="12">{cal['totalContributions']} contributions in the last year</text></svg>''')
          PY
      - name: Commit analytics cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub analytics"
          git push