name: Update GitHub Analytics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate analytics cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: prathamc00
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from collections import Counter
          from datetime import datetime, timezone

          token=os.environ['GH_TOKEN']; user=os.environ['USERNAME']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'}

          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r: return json.load(r)

          def gql(query, variables):
              data=json.dumps({'query':query,'variables':variables}).encode()
              req=urllib.request.Request('https://api.github.com/graphql',data=data,headers={**headers,'Content-Type':'application/json'})
              with urllib.request.urlopen(req) as r: return json.load(r)['data']

          profile=get(f'https://api.github.com/users/{user}')
          repos=get(f'https://api.github.com/users/{user}/repos?per_page=100&sort=updated')
          languages=Counter()
          for repo in repos:
              if repo.get('fork'): continue
              try: languages.update(get(repo['languages_url']))
              except Exception: pass

          query='query($login:String!){user(login:$login){pullRequests(first:1){totalCount} issues(first:1){totalCount} contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{contributionLevel contributionCount date}}}}}}'
          data=gql(query,{'login':user})['user']
          cal=data['contributionsCollection']['contributionCalendar']
          total_contrib=cal['totalContributions']
          prs=data['pullRequests']['totalCount']; issues=data['issues']['totalCount']
          stars=sum(r.get('stargazers_count',0) for r in repos)
          commits=sum(d['contributionCount'] for w in cal['weeks'] for d in w['contributionDays'])

          # Current and longest streak from contribution calendar.
          days=[d['contributionCount']>0 for w in cal['weeks'] for d in w['contributionDays']]
          current=0
          for active in reversed(days):
              if active: current+=1
              elif current: break
          longest=run=0
          for active in days:
              run=run+1 if active else 0; longest=max(longest,run)

          orange='#F97316'; bright='#FB923C'; gold='#FDBA74'; text='#FFF7ED'; muted='#B8A99A'; bg='#0D0906'; card='#17100B'; panel='#21140B'; line='#3A2617'
          os.makedirs('profile',exist_ok=True)
          date=datetime.now(timezone.utc).strftime('%d %b %Y')

          def esc(s): return str(s).replace('&','&amp;').replace('<','&lt;').replace('>','&gt;')
          def svg_open(w,h,title,subtitle):
              return f'<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" viewBox="0 0 {w} {h}"><defs><linearGradient id="o" x1="0" x2="1"><stop stop-color="{orange}"/><stop offset="1" stop-color="{bright}"/></linearGradient></defs><rect width="{w}" height="{h}" rx="16" fill="{card}" stroke="{line}"/><rect x="24" y="22" width="44" height="4" rx="2" fill="url(#o)"/><text x="24" y="55" fill="{text}" font-family="Arial,sans-serif" font-size="21" font-weight="700">{title}</text><text x="24" y="75" fill="{muted}" font-family="Arial,sans-serif" font-size="12">{subtitle}</text>'

          # Stats card: closer to the reference design, with 5 useful metrics.
          items=[('TOTAL STARS',stars),('COMMITS',commits),('FOLLOWERS',profile.get('followers',0)),('PULL REQUESTS',prs),('ISSUES',issues)]
          x=24
          stats=svg_open(1000,245,'GitHub Overview','A quick snapshot of your open-source activity')
          for label,val in items:
              stats+=f'<rect x="{x}" y="98" width="176" height="92" rx="12" fill="{bg}" stroke="{line}"/><text x="{x+16}" y="123" fill="{gold}" font-family="Arial,sans-serif" font-size="10" font-weight="700">{label}</text><text x="{x+16}" y="162" fill="{bright}" font-family="Arial,sans-serif" font-size="27" font-weight="700">{val:,}</text>'
              x+=190
          stats+=f'<text x="24" y="220" fill="{muted}" font-family="Arial,sans-serif" font-size="11">Updated {date} · {profile.get("public_repos",0)} public repositories</text></svg>'
          open('profile/github-stats.svg','w').write(stats)

          # Languages card.
          total_lang=sum(languages.values()) or 1; top=languages.most_common(7)
          langs=svg_open(1000,300,'Most Used Languages','Based on language bytes across your public repositories')
          y=105
          for name,count in top:
              pct=count/total_lang*100; width=900*pct/100
              langs+=f'<text x="24" y="{y}" fill="{text}" font-family="Arial,sans-serif" font-size="13" font-weight="600">{esc(name)}</text><text x="976" y="{y}" text-anchor="end" fill="{gold}" font-family="Arial,sans-serif" font-size="12">{pct:.1f}%</text><rect x="24" y="{y+10}" width="952" height="7" rx="3.5" fill="{line}"/><rect x="24" y="{y+10}" width="{max(4,width):.1f}" height="7" rx="3.5" fill="url(#o)"/>'
              y+=30
          langs+='</svg>'
          open('profile/top-langs.svg','w').write(langs)

          # Streak card.
          streak=svg_open(1000,220,'Contribution Streak','Consistency over the last year')
          streak+=f'<rect x="24" y="100" width="300" height="82" rx="12" fill="{bg}" stroke="{line}"/><rect x="350" y="100" width="300" height="82" rx="12" fill="{bg}" stroke="{line}"/><rect x="676" y="100" width="300" height="82" rx="12" fill="{bg}" stroke="{line}"/><text x="44" y="126" fill="{gold}" font-family="Arial,sans-serif" font-size="10" font-weight="700">CURRENT STREAK</text><text x="44" y="159" fill="{bright}" font-family="Arial,sans-serif" font-size="25" font-weight="700">{current} days</text><text x="370" y="126" fill="{gold}" font-family="Arial,sans-serif" font-size="10" font-weight="700">LONGEST STREAK</text><text x="370" y="159" fill="{bright}" font-family="Arial,sans-serif" font-size="25" font-weight="700">{longest} days</text><text x="696" y="126" fill="{gold}" font-family="Arial,sans-serif" font-size="10" font-weight="700">TOTAL CONTRIBUTIONS</text><text x="696" y="159" fill="{bright}" font-family="Arial,sans-serif" font-size="25" font-weight="700">{total_contrib:,}</text></svg>'
          open('profile/streak.svg','w').write(streak)

          # Contribution skyline: weekly bars, inspired by the reference skyline but fully local.
          weekly=[]
          for w in cal['weeks']:
              weekly.append(sum(d['contributionCount'] for d in w['contributionDays']))
          maxv=max(weekly) or 1; width=952/max(len(weekly),1)
          sky=svg_open(1000,300,'Contribution Skyline','Weekly contribution intensity · last 52 weeks')
          base=255; usable=145
          for i,v in enumerate(weekly[-52:]):
              h=max(3,usable*v/maxv); x=24+i*width; y=base-h
              sky+=f'<rect x="{x:.1f}" y="{y:.1f}" width="{max(3,width-2):.1f}" height="{h:.1f}" rx="2" fill="{orange if v<maxv*0.65 else bright}" opacity="{0.35+0.65*(v/maxv):.2f}"/>'
          sky+=f'<line x1="24" y1="{base}" x2="976" y2="{base}" stroke="{line}"/><text x="24" y="278" fill="{gold}" font-family="Arial,sans-serif" font-size="11" font-weight="600">{total_contrib:,} contributions in the last year</text><text x="976" y="278" text-anchor="end" fill="{muted}" font-family="Arial,sans-serif" font-size="11">Less → More activity</text></svg>'
          open('profile/contribution-skyline.svg','w').write(sky)
          PY
      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "chore: refresh GitHub analytics"
          git push